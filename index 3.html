<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botão Livro</title>

  <style>
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Botão em formato de livro */
    .book-button {
      width: 150px;
      height: 100px;
      background: linear-gradient(
        to right,
        #ffffff 0%,
        #eeeeee 48%,
        #cccccc 50%,
        #eeeeee 52%,
        #ffffff 100%
      );

      border: 2px solid #999;
      border-radius: 5px 10px 10px 5px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);

      cursor: pointer;
      position: relative;

      transition: 0.3s ease;
    }

    /* Lombada do livro */
    .book-button::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 5px;
      bottom: 5px;
      width: 3px;
      background: #aaa;
      border-radius: 2px;
    }

    /* Linhas das páginas */
    .book-button::after {
      content: "";
      position: absolute;
      right: 10px;
      top: 15px;
      width: 55px;
      height: 2px;
      background: #aaa;
      box-shadow:
        0 8px #aaa,
        0 16px #aaa,
        0 24px #aaa,
        0 32px #aaa;
      opacity: 0.7;
    }

    .book-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.25);
    }

    /* Estilo depois do clique */
    .book-button.active {
      background: linear-gradient(
        to right,
        #e8e8e8,
        #ffffff 45%,
        #999999 50%,
        #ffffff 55%,
        #e8e8e8
      );

      border-color: #666;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <button class="book-button" id="bookButton" aria-label="Mudar estilo do livro"></button>

  <script>
    const button = document.getElementById("bookButton");

    button.addEventListener("click", () => {
      button.classList.toggle("active");
    });
  </script>

</body>
</html>
